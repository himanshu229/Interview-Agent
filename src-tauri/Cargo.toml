[package]
name = "ai-desktop-assistant"
version = "1.0.0"
description = "AI Desktop Assistant - ChatGPT, OCR, and live transcription for your desktop"
authors = ["AI Desktop Assistant Team"]
edition = "2021"
rust-version = "1.77"

# The library is what the mobile/desktop entry points call into.
[lib]
name = "ai_desktop_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }

# Persistence
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Secure secret storage (OS keychain)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Screenshot capture (cross-platform)
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Audio capture + WAV encoding
cpal = "0.15"
hound = "3.5"

# OCR (wraps the tesseract CLI)
rusty-tesseract = "1.1"

# PDF text extraction (resume parsing)
pdf-extract = "0.7"

# Utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
parking_lot = "0.12"
dirs = "5"
once_cell = "1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
